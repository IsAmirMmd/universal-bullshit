<svg xmlns="http://www.w3.org/2000/svg" width="560" height="330" viewBox="0 0 560 330">
  <style>
    .node { fill: #fff; stroke: #222; stroke-width: 1.6; }
    .name { font: 700 18px "Segoe UI", Arial, sans-serif; fill: #111; text-anchor: middle; }
    .out  { font: 13px Consolas, "Cascadia Mono", monospace; fill: #555; text-anchor: middle; }
    .edge { stroke: #222; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    .dash { stroke-dasharray: 6 5; }
    .lbl  { font: 13px Consolas, "Cascadia Mono", monospace; fill: #222; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>

  <!-- edges -->
  <path class="edge" d="M262,82 L178,146"/>
  <text class="lbl" x="152" y="108">fork #1</text>
  <path class="edge dash" d="M298,82 L382,146"/>
  <text class="lbl" x="350" y="108">fork #2</text>
  <path class="edge dash" d="M140,206 L140,246"/>
  <text class="lbl" x="152" y="231">fork #2</text>

  <!-- nodes: name + what it prints -->
  <rect class="node" x="240" y="24" width="80" height="56" rx="8"/>
  <text class="name" x="280" y="49">P</text>
  <text class="out"  x="280" y="69">Hello</text>

  <rect class="node" x="100" y="148" width="80" height="56" rx="8"/>
  <text class="name" x="140" y="173">C1</text>
  <text class="out"  x="140" y="193">Hello</text>

  <rect class="node" x="380" y="148" width="80" height="56" rx="8"/>
  <text class="name" x="420" y="173">C2</text>
  <text class="out"  x="420" y="193">Hello</text>

  <rect class="node" x="100" y="248" width="80" height="56" rx="8"/>
  <text class="name" x="140" y="273">C3</text>
  <text class="out"  x="140" y="293">Hello</text>
</svg>
